name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify packages without publishing them
        required: false
        default: false
        type: boolean
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@fastppt'
      - name: Install trusted-publishing compatible npm
        run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Verify publishable packages
        run: |
          pnpm --filter @fastppt/slidewave typecheck
          pnpm --filter @fastppt/slidewave lint
          pnpm --filter @fastppt/slidewave test
          pnpm --filter @fastppt/cli typecheck
          pnpm --filter @fastppt/cli lint
          pnpm --filter @fastppt/cli test
      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        run: pnpm npm:publish
      - name: Dry-run package publishing
        if: ${{ inputs.dry_run }}
        run: pnpm npm:publish:dry-run
