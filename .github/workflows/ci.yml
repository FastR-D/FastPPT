name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fastppt/fonts verify-fonts
      - run: pnpm --filter @fastppt/e2e exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      # Each package launches its own workers/Slidev builds on the shared runner.
      - run: pnpm test --concurrency=2
      - run: pnpm build --concurrency=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
