name: FastPPT v1.2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/agent-harness/package-lock.json
            apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[kernel,agents]"
      - run: npm ci --prefix packages/agent-harness --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix apps/web
      - name: Run Python tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output/ci | Out-Null
          & .\.venv\Scripts\python.exe -u -m unittest discover -s tests -p "test_*.py" -v 2>&1 |
            Tee-Object -FilePath output/ci/windows-test.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastppt-v1.2.0-windows-test-diagnostics
          path: output/ci/windows-test.log
          if-no-files-found: error
      - name: Publish Windows test failure summary
        if: failure()
        shell: pwsh
        run: |
          $logPath = "output/ci/windows-test.log"
          if (-not (Test-Path -LiteralPath $logPath)) {
            "::error title=Windows test failure::Test log was not produced"
            exit 0
          }
          $lines = Get-Content -LiteralPath $logPath -Encoding UTF8
          $hits = @($lines | Select-String -Pattern "(^FAIL:|^ERROR:|Traceback|AssertionError|FAILED|Exception|Process completed with exit code)")
          if ($hits.Count -eq 0) {
            $excerpt = @($lines | Select-Object -Last 100)
          } else {
            $first = [Math]::Max(0, $hits[0].LineNumber - 8)
            $excerpt = @($lines | Select-Object -Skip $first -First 120)
          }
          $redacted = @($excerpt | ForEach-Object {
            $_ -replace "(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*[^\s]+", '$1=<redacted>'
          })
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Windows test failure excerpt`n````text`n$($redacted -join "`n")`n````"
          foreach ($line in $redacted) {
            $safe = $line -replace "%", "%25" -replace "`r|`n", " " -replace "\x1b\[[0-9;]*[A-Za-z]", ""
            Write-Output "::error title=Windows test failure::$safe"
          }
      - run: .\.venv\Scripts\python.exe tools/check_repo_hygiene.py
      - run: .\.venv\Scripts\python.exe -c "from fastppt_ppt_master import PptMasterAdapter; assert PptMasterAdapter().probe()['status'] == 'ready'"

  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fastppt
          POSTGRES_USER: fastppt
          POSTGRES_PASSWORD: fastppt-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastppt -d fastppt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTPPT_SERVER_INTEGRATION: "1"
      FASTPPT_TEST_DATABASE_URL: postgresql://fastppt:fastppt-ci-password@127.0.0.1:5432/fastppt
      FASTPPT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FASTPPT_TEST_S3_BUCKET: fastppt-ci
      FASTPPT_TEST_S3_ACCESS_KEY: fastppt-ci-access
      FASTPPT_TEST_S3_SECRET_KEY: fastppt-ci-secret-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[server,kernel]"
      - name: Start MinIO
        run: >-
          docker run --detach --rm --name fastppt-ci-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER="$FASTPPT_TEST_S3_ACCESS_KEY"
          --env MINIO_ROOT_PASSWORD="$FASTPPT_TEST_S3_SECRET_KEY"
          minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
      - run: python -m unittest tests.integration.test_server_backends -v
      - name: Upload server integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastppt-v1.2.0-server-evidence
          path: output/provider-evidence/server-postgres-s3-*.json
          if-no-files-found: error
